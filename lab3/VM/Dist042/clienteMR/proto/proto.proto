syntax = "proto3";

package AeroDist;

option go_package = "/proto";

service Broker{//Servicio Broker con clientes MR
    rpc MRRead(MRReadRequest) returns (MRReadResponse);
}

message MRReadRequest{
    string flight_id = 1;
    string client_id = 2;
    int64 last_version_seen = 3;
}

message MRReadResponse{
    string flight_id = 1;
    string status = 2;
    string gate = 3;
    int64 version = 4;
    bool success = 5;
    string msg = 6;
}