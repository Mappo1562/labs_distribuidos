services:
  broker:
    build: ./broker
    container_name: broker
    ports:
      - "50050:50050"
    volumes:
      - ./reportes:/app/reportes

  grupo1:
    build: ./consumidores
    container_name: grupo1
    environment:
      - GRUPO=1
      - BROKER_ADDR=broker:50050
    depends_on:
      - broker
    volumes:
      - ./consumidores/ofertas/grupo1:/app/ofertas
