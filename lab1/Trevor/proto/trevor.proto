syntax = "proto3";

option go_package = "grpc-server/proto";
package trevor;

service Distraccion {
    rpc InicioDistraccion(Instruccion) returns (ResultadoDistraccion) {}
}

message Instruccion{
    int64 numTurnos = 1;
}

message ResultadoDistraccion{
    string ExitoDistraccion = 1;
    bool exito = 2;
}

message Vacio{}