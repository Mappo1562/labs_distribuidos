syntax = "proto3";

option go_package = "grpc-server/proto";
package prueba;

service prueba {
    rpc solicitar_oferta(OperationRequest) returns (OperationResponse) {}
    rpc ProcessOperation(OperationRequest) returns (OperationResponse) {}
}

message OperationRequest{
    string solicitud_oferta = 1;
}

message OperationResponse{
    string oferta = 1;
}