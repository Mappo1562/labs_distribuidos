syntax = "proto3";

option go_package = "grpc-server/proto";
package Atraco;

service Distraccion {
    rpc InicioDistraccion(Instruccion) returns (ResultadoDistraccion) {}
}

message Instruccion{
    int64 numTurnos = 1;
}

message ResultadoDistraccion{
    string ExitoDistraccion = 1;
    bool exito = 2;
}

service Golpe {
    rpc InicioGolpe(Instruccion) returns (ResultadoGolpe) {}
}

message ResultadoGolpe{
    bool ExitoGolpe = 1;
    int64 BotinExtra = 3;
}



message Vacio{}